# Run Gradle on the JDK 21 that `kotlin { jvmToolchain(21) }` in build.gradle.kts
# provisions — Gradle 8.10.x doesn't support Java 25 as a launcher, and IntelliJ
# Platform requires JDK 21. Locally, set JAVA_HOME to a JDK 21 install (any vendor:
# Temurin / Microsoft / Zulu / Corretto); CI wires JAVA_HOME up via
# actions/setup-java. Do NOT hard-code a machine-specific path here — it breaks
# every other environment.

# Larger heap for IntelliJ Platform builds.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC

# Disable telemetry banner.
org.gradle.welcome=never
